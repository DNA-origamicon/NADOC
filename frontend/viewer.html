<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NADOC Viewer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161b22;color:#e6edf3;font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#0d1117;border-bottom:1px solid #30363d}h1{font-size:16px;margin:0;flex:1}button,select,.open{background:#21262d;color:inherit;border:1px solid #484f58;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}dialog{width:min(760px,90vw);color:inherit;background:#161b22;border:1px solid #484f58;border-radius:8px}dialog textarea{width:100%;margin-top:12px}dialog label{display:inline-block;margin:8px}dialog input{position:static;width:60px;height:auto;opacity:1}button:disabled,select:disabled{opacity:.5}input{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}[data-trajectory] input[type=range]{position:static;width:160px;height:auto;opacity:1}.open:focus-within{outline:2px solid #58a6ff}main{flex:1;min-height:0;position:relative}canvas{display:block;width:100%;height:100%;touch-action:none}footer{padding:10px 18px;border-top:1px solid #30363d;color:#b1bac4}.note{font-size:12px;color:#8b949e}
</style></head>
<body><header><h1 id="title">NADOC Viewer <span class="note">Experimental</span></h1><label class="open">Open prepared view<input id="file" type="file" accept=".nadocview"></label><select id="mode" aria-label="Navigation mode" disabled><option value="multiscale">Multiscale</option><option value="orbit">Orbit</option><option value="trackball">Trackball</option></select><button id="reset" disabled>Reset view</button></header>
<main><canvas id="canvas" aria-label="3D design viewer"></canvas></main><footer id="status" role="status">Open or drop a .nadocview file. Files stay in this browser. Prepared static views and shared Full trajectory clips.</footer>
<dialog id="performance"><button id="close-metrics">Close</button></dialog>
<span id="guest" style="padding:0 18px 8px;color:#b1bac4"></span>
<dialog id="join"><form id="join-form"><h2>Join shared design</h2><p>Enter your name to join. You can rotate and explore the design independently.</p><label for="guest-name">Display name</label><input id="guest-name" name="name" required maxlength="40" autocomplete="nickname" style="width:100%;padding:10px;opacity:1"><div id="meeting-password-row" hidden><label for="meeting-password">Meeting password</label><input id="meeting-password" name="password" type="password" maxlength="128" autocomplete="off" spellcheck="false" style="width:100%;padding:10px;opacity:1"></div><p id="join-error" role="alert"></p><button id="join-submit" type="submit">Join view</button></form></dialog>
<script type="module" src="/src/viewer/entry.js"></script></body></html>
