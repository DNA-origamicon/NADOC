<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NADOC — Strand Animations Testing</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230d1117'/><line x1='4' y1='11' x2='28' y2='11' stroke='%2358a6ff' stroke-width='3' stroke-linecap='round'/><line x1='4' y1='21' x2='28' y2='21' stroke='%23ff7c7c' stroke-width='3' stroke-linecap='round'/><line x1='9' y1='11' x2='9' y2='21' stroke='%238b949e' stroke-width='2'/><line x1='15' y1='11' x2='15' y2='21' stroke='%238b949e' stroke-width='2'/></svg>">

  <!-- Same design-system foundation as the 3D view + cadnano editor. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/reset.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0d1117; font-family: var(--font-ui); color: #e6edf3; overflow: hidden; }

    #sa-root { display: flex; flex-direction: column; height: 100%; }

    #sa-titlebar {
      flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: #161b22; border-bottom: 1px solid #30363d;
      font-size: 13px; font-weight: 600;
    }
    #sa-titlebar .sa-sub { font-weight: 400; color: #8b949e; font-size: 12px; }

    #sa-main { flex: 1 1 auto; display: flex; min-height: 0; }

    #sa-canvas-wrap { flex: 1 1 auto; position: relative; min-width: 0; }
    #strand-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    #strand-readout {
      position: absolute; top: 12px; left: 14px; pointer-events: none;
      font-family: var(--font-mono, 'JetBrains Mono', monospace); font-size: 12px;
      color: #c9d1d9; background: rgba(13,17,23,0.65); border: 1px solid #30363d;
      border-radius: 6px; padding: 6px 10px; white-space: pre;
    }

    /* ── right sidebar ── */
    #sa-sidebar {
      flex: 0 0 320px; width: 320px; background: #0d1117;
      border-left: 1px solid #30363d; overflow-y: auto; padding: 10px 12px 40px;
    }
    #strand-panel-body { display: flex; flex-direction: column; gap: 6px; }

    /* ── controls ── */
    .sa-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; }
    .sa-row--stack { flex-direction: column; align-items: stretch; }
    .sa-lbl { font-size: 12px; color: #c9d1d9; }
    .sa-ctl { display: flex; align-items: center; gap: 6px; }
    .sa-unit { font-size: 11px; color: #8b949e; min-width: 34px; }

    .sa-num, .sa-sel {
      width: 78px; background: #161b22; color: #e6edf3; border: 1px solid #30363d;
      border-radius: 5px; padding: 4px 6px; font-size: 12px; font-family: var(--font-mono, monospace);
    }
    .sa-sel { width: auto; min-width: 120px; font-family: var(--font-ui); }
    .sa-num--sm { width: 64px; }
    .sa-range { width: 100%; accent-color: #58a6ff; margin-top: 4px; }
    .sa-chk { width: 16px; height: 16px; accent-color: #58a6ff; }

    .sa-seg { display: flex; gap: 4px; margin-top: 4px; }
    .sa-seg-btn {
      flex: 1; padding: 6px 8px; font-size: 12px; cursor: pointer;
      background: #161b22; color: #8b949e; border: 1px solid #30363d; border-radius: 5px;
    }
    .sa-seg-btn.is-active { background: #1f6feb; color: #fff; border-color: #1f6feb; }

    .sa-play {
      width: 100%; padding: 9px 10px; font-size: 13px; font-weight: 600; cursor: pointer;
      background: #238636; color: #fff; border: 1px solid #2ea043; border-radius: 6px;
    }
    .sa-play:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div id="sa-root">
    <div id="sa-titlebar">
      <span>Strand Animations Testing</span>
      <span class="sa-sub">— un/hybridization sandbox · φ = fraction paired · display-only</span>
    </div>
    <div id="sa-main">
      <div id="sa-canvas-wrap">
        <canvas id="strand-canvas"></canvas>
        <div id="strand-readout">φ = 1.000</div>
      </div>
      <div id="sa-sidebar">
        <div id="strand-panel-body"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/strand-anim/main.js"></script>
</body>
</html>
