# Continuous Integration — runs the test suites + lint on every push and PR.
#
# This is the automated backstop for the two-computer workflow: whichever
# machine you pushed from, GitHub re-runs everything on a *fresh* checkout, so
# it also catches "I forgot to commit that new file". A red ✗ on the commit
# (and an email) tells you immediately which push broke something.
#
# What it does NOT cover: the 3D UI. Playwright/smoke and visual correctness are
# still the manual `NOT VERIFIED IN APP` step (see manual_validation_debt.md).
# This guards backend logic + the pure-function frontend unit tests only.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (incl. dev group for ruff)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check backend/ tests/

      - name: Restore native placement review ledger
        uses: actions/cache/restore@v4
        with:
          path: .native-placement-review
          key: native-placement-review-v1-backend-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-placement-review-v1-backend-${{ github.ref }}-

      - name: Apply explicit native placement review acknowledgements
        run: python3 -m tools.native_placement_audit apply-reviews

      # Deselect `slow` (runs GROMACS energy-minimisation) and `integration`
      # (needs external files at /tmp) — neither is available on a CI runner.
      # Tests for conda-only deps (openmm) skip gracefully on their own.
      - name: Test
        run: uv run pytest tests/ -m "not slow and not integration" -q

      - name: Require completed native placement review
        if: always()
        run: |
          python3 -m tools.native_placement_audit apply-reviews
          python3 -m tools.native_placement_audit check

      - name: Retain native placement incident reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-placement-review-backend-${{ github.run_attempt }}
          path: .native-placement-review
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Preserve native placement review latch across reruns
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .native-placement-review
          key: native-placement-review-v1-backend-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Restore native placement review ledger
        uses: actions/cache/restore@v4
        with:
          path: .native-placement-review
          key: native-placement-review-v1-frontend-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: native-placement-review-v1-frontend-${{ github.ref }}-

      - name: Apply explicit native placement review acknowledgements
        run: python3 -m tools.native_placement_audit apply-reviews

      # Unit tests only — Playwright e2e/smoke is too slow for the gate and
      # needs running servers + browsers (kept as the local commit gate).
      - name: Test
        run: npm test
        working-directory: frontend

      - name: Require completed native placement review
        if: always()
        run: |
          python3 -m tools.native_placement_audit apply-reviews
          python3 -m tools.native_placement_audit check

      - name: Retain native placement incident reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-placement-review-frontend-${{ github.run_attempt }}
          path: .native-placement-review
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Preserve native placement review latch across reruns
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .native-placement-review
          key: native-placement-review-v1-frontend-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
