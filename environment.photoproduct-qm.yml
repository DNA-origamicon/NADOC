name: nadoc-qm
channels:
  - conda-forge
dependencies:
  - python=3.12
  - psi4=1.11
  # Distributed finite-difference plans/results use these QCSchema implementations.
  - qcengine=0.51.0
  - qcelemental=0.51.0
  - numpy=2.5.2
  - rdkit=2026.03.5
  - pip
  - pip:
      # ForceBalance 1.9.5 omits these runtime dependencies from its wheel metadata.
      - forcebalance==1.9.5
      - future==1.0.0
      - lxml==6.1.3
      - openmm==8.6.0
      - pymbar==3.1.0
      - setuptools<81
