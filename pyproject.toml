[project]
name = "nadoc"
version = "0.1.0"
description = "Not Another DNA Origami CAD — advanced design tool for DNA origami researchers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "numba>=0.64.0",
    "numpy>=2.4.3",
    "orjson>=3.10",
    "pdfminer-six>=20260107",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.41.0",
    "parmed>=4.3.0",
    "websockets>=16.0",
    "scipy>=1.17.1",
    "scikit-image>=0.25.0",
    "watchdog>=4.0",
    "mdanalysis>=2.10.0",
    "networkx>=3.6.1",
    "pandas>=3.0.2",
    "appdirs>=1.4.4",
    "openpyxl>=3.1",
    "asyncssh>=2.24.0",
]

# Phase 9 checker: openmm>=8.0 is a conda-only dependency and cannot be installed via pip.
# Install with: conda install -c conda-forge openmm>=8.0
# Required by: backend/checkers/openmm_checker.py
# Tests in tests/test_openmm_checker.py skip gracefully when openmm is absent.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (run GROMACS EM; deselect with -m 'not slow')",
    "integration: marks tests requiring external files at /tmp",
    # Area sub-markers on slow tests, for change-based selection (just test-smart /
    # scripts/select_tests.py). A slow test carries `slow` + exactly one of these.
    "oxdna: slow oxDNA/oxpy group",
    "cando: slow CanDo-FEM / autorefine group",
    "namd: slow NAMD-topology group",
    "mrdna: slow mrdna group",
    "atomistic: slow atomistic group",
    "md: slow MD-pipeline / trajectory / benchmark group",
    "headless: slow headless build/routing group",
]

[tool.ruff]
target-version = "py312"

# Ruff's default lint set is E4/E7/E9 + F. We keep all of F (pyflakes — the rules
# that catch REAL problems: unused imports/variables, undefined names, bad
# f-strings) and the load-bearing E checks, but silence the pycodestyle *style*
# rules that clash with this codebase's deliberate conventions. Without this, ~300
# cosmetic findings bury the handful of real ones and `just lint` is noise.
[tool.ruff.lint]
ignore = [
    "E701",  # `if x: return` one-liners — intentional compact style throughout
    "E702",  # `a; b` one-liners — same
    "E741",  # ambiguous names l/I/O — used deliberately in math/index code
    "E731",  # assigning a lambda to a name — used deliberately
    "E401",  # multiple imports on one line — stylistic
    "E402",  # import not at top of file — intentional lazy/conditional (optional deps)
]

[tool.ruff.lint.per-file-ignores]
# These modules annotate parameters with forward-reference type names that are
# imported lazily inside a function (or resolved only by a type-checker), e.g.
# `design: 'Optional[Design]'`. The annotation strings are never evaluated at
# runtime, so F821 here is a type-checker concern, not a runtime bug. Scoped to
# these files so F821 still catches genuine undefined-name typos everywhere else.
"backend/api/assembly.py" = ["F821"]
"backend/api/crud.py" = ["F821"]
"backend/core/pdb_export.py" = ["F821"]
"backend/core/atomistic_to_nadoc.py" = ["F821"]
"backend/parameterization/validation_stub.py" = ["F821"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.6",
    "ruff>=0.15.14",
]
